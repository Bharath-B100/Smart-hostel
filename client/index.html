<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/avif" href="/Login.avif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr N.G.P IT - Smart Hostel Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.3s, visibility 0.3s; font-family: 'Outfit', sans-serif; }
      .loading-screen.hidden { opacity: 0; visibility: hidden; }
      .loading-screen img { width: 150px; margin-bottom: 20px; animation: pulse 1.5s infinite ease-in-out; }
      @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }
    </style>
  </head>
  <body>
    <div class="loading-screen" id="loadingScreen">
      <img src="/Login.avif" alt="Loading Logo" />
    </div>
    <div class="notification" id="notification"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
